<!DOCTYPE html>
<html>

<head>
    <title> Yujin's English Learning App</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 25px;
            padding: 12px;
            margin: 10px;
            background-color: yellow;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "give up" mean?</p>

    <button onclick="checkAnswer('give up')">
        Give up
    </button>

    <button onclick="checkAnswer('avoid')">
        Avoid
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "give up") {
                document.getElementById("feedback").innerText =
                    "정답입니다!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "틀렸어요. 정답은 give up(포기하다)입니다.";
            }

        }

    </script>

</body>
</html>
